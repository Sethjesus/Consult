<html lang="zh-TW">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>皓樣諮詢輔導</title>

<style>
/* ===== 全域 ===== */
html, body {
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background-image: url('https://github.com/Sethjesus/Photo/blob/main/sky3.jpg?raw=true');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    color: #0f172a;
    padding-bottom: 120px; /* 避免浮動按鈕與 footer 擋內容 */
}

/* ===== 呼吸 Logo ===== */
.logo {
    position: fixed;
    top: 14px;
    left: 14px;
    width: 60px;
    z-index: 999;
    animation: breathe 4s ease-in-out infinite;
    filter: drop-shadow(0 6px 16px rgba(0,0,0,.35));
}

@keyframes breathe {
    0%   { transform: scale(1); opacity: .95; }
    50%  { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); opacity: .95; }
}

/* ===== 標題 ===== */
h1 {
    text-align: center;
    margin: 28px 0 24px;
    font-size: 48px;
    font-weight: 800;
    color: #0b5ed7;
    letter-spacing: 1px;
    text-shadow: 2px 2px 6px rgba(0, 255, 0, 0.65);
}

/* ===== 表格容器 ===== */
.table-wrap {
    width: min(1100px, 92vw);
    margin: 0 auto;
}

/* ===== 表格 ===== */
table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: rgba(255,255,255,0.78);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 16px;
    box-shadow: 0 18px 40px rgba(0,0,0,.18);
    overflow: hidden;
}

th, td {
    padding: 16px 20px;
    text-align: left;
}

th {
    background: linear-gradient(0deg, #0b6bff, #084fbe);
    color: #fff;
    font-size: 18px;
}

td {
    font-size: 16px;
    line-height: 1.8;
    color: #1f2937;
    border-top: 1px solid rgba(0,0,0,.08);
}

/* 左欄項目 */
.content-left .highlight {
    font-size: 20px;
    font-weight: 800;
    color: #0f172a;
}

/* Hover（不抖動） */
tbody tr:hover td {
    background-color: rgba(240, 248, 255, 0.8);
}

/* 連結 */
a {
    color: #0b5ed7;
    font-weight: 700;
    text-decoration: none;
    position: relative;
}

a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -2px;
    width: 0%;
    height: 2px;
    background: currentColor;
    transition: width .25s ease;
}

a:hover::after {
    width: 100%;
}

/* ===== Footer（僅保留品牌） ===== */
footer {
    position: fixed;
    bottom: 0;
    width: 100%;
    height: 60px;
    background: rgba(44, 62, 80, 0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    z-index: 100;
    font-size: 14px;
}

/* ==============================
   共用浮動回首頁 Home Button
   ============================== */
.float-home-btn{
    position: fixed;
    right: 22px;
    bottom: 22px;

    width: 64px;
    height: 72px;
    border-radius: 18px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;

    color: #eff6ff;
    text-decoration: none;
    font-weight: 700;

    background: linear-gradient(135deg, #0b6bff, #00c6ff);
    box-shadow: 0 14px 30px rgba(11,107,255,.45);

    z-index: 9999;
    transition: transform .2s ease,
                box-shadow .2s ease,
                filter .2s ease;
}

.float-home-btn .icon{
    font-size: 24px;
    line-height: 1;
}

.float-home-btn .label{
    font-size: 12px;
    line-height: 1;
    opacity: .95;
}

.float-home-btn:hover{
    transform: translateY(-4px);
    box-shadow: 0 20px 40px rgba(11,107,255,.55);
    filter: brightness(1.08);
}

/* ===== RWD ===== */
@media (max-width: 768px) {
    h1 { font-size: 36px; }
    th, td { padding: 14px 16px; }

    .float-home-btn{
        width: 56px;
        height: 64px;
        right: 16px;
        bottom: 16px;
    }
    .float-home-btn .icon{ font-size: 22px; }
    .float-home-btn .label{ font-size: 11px; }
}
</style>
</head>

<body>

<!-- Logo -->
<img src="https://pub-531c96b02ed745e0bbfd0e96bfde8518.r2.dev/UDM%20New%20Logo.jpg"
     alt="公司 Logo"
     class="logo">

<h1>諮詢輔導</h1>

<div class="table-wrap">
<table>
<thead>
<tr>
    <th style="width:30%;">項目</th>
    <th style="width:70%;">內容</th>
</tr>
</thead>

<tbody>
<tr>
    <td class="content-left">
        <p class="highlight">0.1 諮詢輔導</p>
    </td>
    <td>
        a. 企業 ESG 永續發展先期輔導諮詢<br>
        b. 低碳化輔導評估
    </td>
</tr>

<tr>
    <td class="content-left">
        <p class="highlight">0.2 綠色辦公響應作法</p>
    </td>
    <td>
        a. 環境部綠色辦公響應作法<br>
        <a href="https://greenlifestyle.moenv.gov.tw/categories/green_office/steps" target="_blank">
            綠色辦公響應指標及措施
        </a>
    </td>
</tr>
</tbody>
</table>
</div>

<!-- 浮動回首頁（共用元件・藍色） -->
<a href="https://jpesg.netlify.app/"
   class="float-home-btn"
   aria-label="回首頁">
  <span class="icon">🏠</span>
  <span class="label">回首頁</span>
</a>

<footer>
© 2026 景煬低碳管理方案團隊製作
</footer>

</body>
</html>
